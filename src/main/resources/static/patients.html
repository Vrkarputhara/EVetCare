<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - EVetCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #2E7D32;
            --primary-dark: #1B5E20;
            --accent: #66BB6A;
            --accent-light: #81C784;
            --bg-primary: #F5F7FA;
            --bg-secondary: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #64748B;
            --border: #E2E8F0;
            --shadow: rgba(46, 125, 50, 0.1);
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #E8F5E9 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        .orb1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #66BB6A 0%, transparent 70%);
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #81C784 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 10px) scale(1.02); }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            opacity: 0.3;
            animation: particle-float 15s infinite linear;
            z-index: 1;
        }

        .particle::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 30px rgba(46, 125, 50, 0.1);
        }

        .sidebar-header {
            padding: 30px;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .sidebar-logo:hover {
            transform: translateX(5px);
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
            animation: logo-pulse 3s infinite;
        }

        @keyframes logo-pulse {
            0%, 100% { box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3); }
            50% { box-shadow: 0 8px 30px rgba(46, 125, 50, 0.5); }
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            list-style: none;
        }

        .sidebar-nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 30px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .sidebar-nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0.1;
            transition: width 0.3s ease;
        }

        .sidebar-nav-link:hover::before {
            width: 100%;
        }

        .sidebar-nav-link:hover {
            color: var(--primary);
            transform: translateX(8px);
        }

        .sidebar-nav-link.active {
            color: var(--primary);
            background: linear-gradient(90deg, rgba(46, 125, 50, 0.1), transparent);
        }

        .sidebar-nav-link.active::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 70%;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 0 4px 4px 0;
        }

        .sidebar-nav-link i {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .sidebar-nav-link:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        .user-profile {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(46, 125, 50, 0.05);
            margin: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
            animation: avatar-glow 2s infinite alternate;
        }

        @keyframes avatar-glow {
            from { box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3); }
            to { box-shadow: 0 4px 25px rgba(46, 125, 50, 0.5); }
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .user-role {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .logout-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn:hover {
            background: var(--primary);
            color: white;
            transform: rotate(180deg);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Page Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            animation: slide-down 0.6s ease-out;
        }

        @keyframes slide-down {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
            animation: title-underline 2s infinite alternate;
        }

        @keyframes title-underline {
            from { width: 60px; }
            to { width: 100px; }
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        /* Buttons */
        .btn-secondary {
            padding: 12px 24px;
            border: 2px solid var(--border);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-secondary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--bg-primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-secondary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: var(--accent);
        }

        .btn-premium {
            padding: 12px 24px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }

        .btn-premium::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-premium:hover::after {
            left: 100%;
        }

        .btn-premium:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.4);
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
            animation: fade-in-up 0.8s ease-out 0.2s both;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .stat-card:hover::before {
            opacity: 1;
            transform: rotate(45deg) translate(20px, 20px);
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(46, 125, 50, 0.15);
            border-color: var(--accent);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .stat-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stat-icon.dogs {
            background: linear-gradient(135deg, #4A90E2, #7BB3F0);
        }

        .stat-icon.cats {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
        }

        .stat-icon.birds {
            background: linear-gradient(135deg, #FFC107, #FFD54F);
        }

        .stat-icon.others {
            background: linear-gradient(135deg, #9C27B0, #BA68C8);
        }

        .stat-info h3 {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 5px;
            animation: count-up 1s ease-out;
        }

        @keyframes count-up {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stat-info p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Search and Filter */
        .search-filter-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            animation: fade-in-up 0.8s ease-out 0.4s both;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 55px;
            border: 2px solid var(--border);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(102, 187, 106, 0.1);
            transform: translateY(-2px);
        }

        .search-input:focus + .search-icon {
            color: var(--primary);
        }

        .filter-dropdown {
            position: relative;
        }

        .filter-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .filter-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .filter-option:hover {
            background: rgba(46, 125, 50, 0.05);
        }

        .filter-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .filter-option label {
            cursor: pointer;
            flex: 1;
            font-weight: 500;
        }

        /* Table */
        .patients-table-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            animation: fade-in-up 0.8s ease-out 0.6s both;
            position: relative;
            overflow: hidden;
        }

        .patients-table-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
            background-size: 200% 100%;
            animation: gradient-slide 3s linear infinite;
        }

        @keyframes gradient-slide {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-custom thead th {
            background: transparent;
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .table-custom thead th:hover {
            color: var(--primary);
            background: rgba(46, 125, 50, 0.05);
        }

        .table-custom thead th i {
            font-size: 12px;
            margin-left: 5px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .table-custom thead th:hover i {
            opacity: 1;
        }

        .table-custom tbody tr {
            transition: all 0.3s ease;
            position: relative;
        }

        .table-custom tbody tr::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .table-custom tbody tr:hover::after {
            transform: scaleX(1);
        }

        .table-custom tbody tr:hover {
            background: rgba(46, 125, 50, 0.03);
            transform: scale(1.01);
            box-shadow: 0 5px 20px rgba(46, 125, 50, 0.08);
        }

        .table-custom tbody td {
            padding: 20px 15px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        /* Patient Card */
        .patient-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .patient-avatar {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
            transition: all 0.3s ease;
        }

        .patient-card:hover .patient-avatar {
            transform: rotate(360deg) scale(1.1);
        }

        .patient-info {
            display: flex;
            flex-direction: column;
        }

        .patient-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 16px;
        }

        .patient-id {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Species Badge */
        .species-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: capitalize;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .species-badge::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .species-badge:hover::before {
            width: 100%;
            height: 100%;
        }

        .species-badge:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .species-badge.dog {
            background: linear-gradient(135deg, #E3F2FD, #BBDEFB);
            color: #1565C0;
        }

        .species-badge.cat {
            background: linear-gradient(135deg, #FFEBEE, #FFCDD2);
            color: #C62828;
        }

        .species-badge.bird {
            background: linear-gradient(135deg, #FFF9C4, #FFEB3B);
            color: #F57F17;
        }

        .species-badge.other {
            background: linear-gradient(135deg, #F3E5F5, #E1BEE7);
            color: #6A1B9A;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }

        .btn-action::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn-action:active::after {
            width: 100px;
            height: 100px;
        }

        .btn-action.view {
            background: linear-gradient(135deg, #E3F2FD, #BBDEFB);
            color: #1565C0;
        }

        .btn-action.view:hover {
            transform: translateY(-3px) rotate(15deg);
            box-shadow: 0 5px 15px rgba(21, 101, 192, 0.3);
        }

        .btn-action.edit {
            background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
            color: #E65100;
        }

            transform: translateY(-3px) rotate(-15deg);
            box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3);

            color: #C62828;

            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 5px 15px rgba(198, 40, 40, 0.3);
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .pagination-info {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .pagination {
            display: flex;
            gap: 5px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .page-item {
            transition: all 0.3s ease;
        }

        .page-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .page-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
            border-radius: 50%;
        }

        .page-link:hover::before {
            width: 100%;
            height: 100%;
        }

        .page-link:hover {
            color: white;
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);

            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, rgba(46, 125, 50, 0.05), rgba(102, 187, 106, 0.05));
            border-bottom: 1px solid var(--glass-border);
            padding: 25px 30px;
        }

        .modal-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 24px;
        }

        .modal-body {
            padding: 30px;
        }

        .form-floating {
            margin-bottom: 20px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(102, 187, 106, 0.1);
            background: rgba(255, 255, 255, 0.95);
        }

        .form-floating label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-floating .form-control:focus ~ label {
            color: var(--primary);
        }

        /* Loading Spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;

            display: none;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);

            border: 1px solid var(--glass-border);
            border-radius: 12px;

            min-width: 300px;
            transform: translateX(400px);

        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid var(--primary);
        }

        .toast.error {
            border-left: 4px solid #DC3545;
        }

        .toast-body {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .toast.success .toast-body {
            color: var(--primary);
        }

        .toast.error .toast-body {
            color: #DC3545;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .mobile-menu-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {

                display: flex;
            }

                transform: translateX(-100%);
            }

            .sidebar.mobile-show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;

            }

            .page-header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .search-filter-container {
                flex-direction: column;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .patients-table-container {
                padding: 20px;

            }

            .table-custom {
                min-width: 700px;
            }

            .pagination-container {
                flex-direction: column;

                text-align: center;
            }

            .modal-content {
                margin: 10px;
            }

            .filter-menu {
                position: fixed;

            }
        }

        @media (max-width: 480px) {

        // Logout
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // Update stats with animation
        function updateStats() {
            const stats = {
                dog: patients.filter(p => p.species === 'dog').length,
                cat: patients.filter(p => p.species === 'cat').length,
                bird: patients.filter(p => p.species === 'bird').length,
                other: patients.filter(p => p.species === 'other').length
            };

            animateValue('dogCount', 0, stats.dog, 1000);
            animateValue('catCount', 0, stats.cat, 1000);
            animateValue('birdCount', 0, stats.bird, 1000);
            animateValue('otherCount', 0, stats.other, 1000);
        }

        // Animate number counting
        function animateValue(id, start, end, duration) {
            const element = document.getElementById(id);
            const range = end - start;
            const increment = range / (duration / 16);
            let current = start;
            
            const timer = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    element.textContent = end;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(current);
                }
            }, 16);
        }

        // Update breed options based on species
        function updateBreedOptions() {
            const species = document.getElementById('species').value;
            const breedSelect = document.getElementById('breed');
            
            breedSelect.innerHTML = '<option value="">Select Breed</option>';
            
            if (species && breedOptions[species]) {
                breedOptions[species].forEach(breed => {
                    const option = document.createElement('option');
                    option.value = breed;
                    option.textContent = breed;
                    breedSelect.appendChild(option);
                });
            }
        }

        // Toggle filter menu
        function toggleFilterMenu() {
            const menu = document.getElementById('filterMenu');
            menu.classList.toggle('show');
        }

        // Apply filters
        function applyFilters() {
            const checkboxes = document.querySelectorAll('.filter-menu input[type="checkbox"]:checked');
            activeFilters = Array.from(checkboxes).map(cb => cb.value);
            
            // Update filter count
            const filterCount = document.getElementById('filterCount');
            if (activeFilters.length > 0) {
                filterCount.style.display = 'inline-block';
                filterCount.textContent = activeFilters.length;
            } else {
                filterCount.style.display = 'none';
            }
            
            // Filter patients
            if (activeFilters.length > 0) {
                filteredPatients = patients.filter(p => activeFilters.includes(p.species));
            } else {
                filteredPatients = [...patients];
            }
            
            currentPage = 1;
            renderPatientsTable();
        }

        // Search patients
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm === '') {
                filteredPatients = activeFilters.length > 0 
                    ? patients.filter(p => activeFilters.includes(p.species))
                    : [...patients];
            } else {
                filteredPatients = patients.filter(patient => 
                    patient.name.toLowerCase().includes(searchTerm) ||
                    patient.owner.toLowerCase().includes(searchTerm) ||
                    patient.species.toLowerCase().includes(searchTerm) ||
                    patient.breed.toLowerCase().includes(searchTerm) ||
                    patient.id.toLowerCase().includes(searchTerm)
                );
                
                // Apply active filters to search results
                if (activeFilters.length > 0) {
                    filteredPatients = filteredPatients.filter(p => activeFilters.includes(p.species));
                }
            }
            
            currentPage = 1;
            renderPatientsTable();
        });

        // Sort table
        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            filteredPatients.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];
                
                if (column === 'date' || column === 'birthDate') {
                    aVal = new Date(aVal);
                    bVal = new Date(bVal);
                } else if (column === 'age') {
                    aVal = calculateAge(a.birthDate);
                    bVal = calculateAge(b.birthDate);
                }
                
                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderPatientsTable();
        }

        // Calculate age
        function calculateAge(birthDate) {
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const monthDiff = today.getMonth() - birth.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                age--;
            }
            
            return age;
        }

        // Render patients table
        function renderPatientsTable() {
            const tableBody = document.getElementById('patientsTableBody');
            tableBody.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedPatients = filteredPatients.slice(startIndex, endIndex);

            if (paginatedPatients.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 60px; color: var(--text-secondary);">
                            <i class="bi bi-inbox" style="font-size: 64px; display: block; margin-bottom: 20px; opacity: 0.3;"></i>
                            <h4 style="margin-bottom: 10px;">No patients found</h4>
                            <p>Try adjusting your search or filters</p>
                        </td>
                    </tr>
                `;
                updatePaginationInfo();
                return;
            }

            paginatedPatients.forEach((patient, index) => {
                const age = calculateAge(patient.birthDate);
                const row = document.createElement('tr');
                row.style.animationDelay = `${index * 0.05}s`;
                row.innerHTML = `
                    <td>
                        <div class="patient-card">
                            <div class="patient-avatar">${patient.name[0]}</div>
                            <div class="patient-info">
                                <span class="patient-name">${patient.name}</span>
                                <span class="patient-id">${patient.id}</span>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="species-badge ${patient.species}">
                            ${getSpeciesIcon(patient.species)} ${patient.species.charAt(0).toUpperCase() + patient.species.slice(1)}
                        </span>
                    </td>
                    <td>${patient.breed}</td>
                    <td>${patient.owner}</td>
                    <td>${age} ${age === 1 ? 'year' : 'years'}</td>
                    <td>${formatDate(patient.date)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-action view" onclick="viewPatient('${patient.id}')" title="View">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn-action edit" onclick="editPatient('${patient.id}')" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn-action delete" onclick="deletePatient('${patient.id}')" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            updatePaginationInfo();
            renderPagination();
        }

        // Get species icon
        function getSpeciesIcon(species) {
            const icons = {
                dog: '🐕',
                cat: '🐈',
                bird: '🦜',
                other: '🐾'
            };
            return icons[species] || '🐾';
        }

        // Format date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Update pagination info
        function updatePaginationInfo() {
            const startIndex = filteredPatients.length === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
            const endIndex = Math.min(currentPage * itemsPerPage, filteredPatients.length);
            
            document.getElementById('showingStart').textContent = startIndex;
            document.getElementById('showingEnd').textContent = endIndex;
            document.getElementById('totalPatients').textContent = filteredPatients.length;
        }

        // Render pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredPatients.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            // Previous button
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">
                    <i class="bi bi-chevron-left"></i>
                </a>
            `;
            pagination.appendChild(prevLi);

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#" onclick="changePage(${i})">${i}</a>`;
                pagination.appendChild(li);
            }

            // Next button
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}`;
            nextLi.innerHTML = `
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">
                    <i class="bi bi-chevron-right"></i>
                </a>
            `;
            pagination.appendChild(nextLi);
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(filteredPatients.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderPatientsTable();
            }
            return false;
        }

        // Save patient
        function savePatient() {
            const form = document.getElementById('patientForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const patientId = document.getElementById('patientId').value;
            const patientData = {
                name: document.getElementById('patientName').value,
                owner: document.getElementById('ownerName').value,
                species: document.getElementById('species').value,
                breed: document.getElementById('breed').value,
                birthDate: document.getElementById('birthDate').value,
                ownerPhone: document.getElementById('ownerPhone').value,
                ownerEmail: document.getElementById('ownerEmail').value,
                notes: document.getElementById('notes').value,
                date: new Date().toISOString().split('T')[0]
            };

            if (patientId) {
                // Edit existing patient
                const index = patients.findIndex(p => p.id === patientId);
                if (index !== -1) {
                    patients[index] = { ...patients[index], ...patientData };
                    showToast('Patient updated successfully', 'success');
                }
            } else {
                // Add new patient
                const newPatient = {
                    id: 'P' + String(patients.length + 1).padStart(3, '0'),
                    ...patientData
                };
                patients.unshift(newPatient);
                showToast('Patient added successfully', 'success');
            }

            // Save to localStorage
            localStorage.setItem('patients', JSON.stringify(patients));

            // Reset and close
            filteredPatients = [...patients];
            renderPatientsTable();
            updateStats();
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('patientModal'));
            modal.hide();
            form.reset();
            document.getElementById('patientId').value = '';
            document.getElementById('modalTitle').textContent = 'Add New Patient';
            document.getElementById('saveButtonText').textContent = 'Save Patient';
        }

        // View patient
        function viewPatient(id) {
            const patient = patients.find(p => p.id === id);
            if (patient) {
                const age = calculateAge(patient.birthDate);
                const viewBody = document.getElementById('viewPatientBody');
                viewBody.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Patient ID:</strong> ${patient.id}</p>
                            <p><strong>Name:</strong> ${patient.name}</p>
                            <p><strong>Species:</strong> ${patient.species.charAt(0).toUpperCase() + patient.species.slice(1)}</p>
                            <p><strong>Breed:</strong> ${patient.breed}</p>
                            <p><strong>Age:</strong> ${age} ${age === 1 ? 'year' : 'years'}</p>
                            <p><strong>Birth Date:</strong> ${formatDate(patient.birthDate)}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Owner:</strong> ${patient.owner}</p>
                            <p><strong>Phone:</strong> ${patient.ownerPhone}</p>
                            <p><strong>Email:</strong> ${patient.ownerEmail || 'Not provided'}</p>
                            <p><strong>Added:</strong> ${formatDate(patient.date)}</p>
                            <p><strong>Medical Notes:</strong></p>
                            <p style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                                ${patient.notes || 'No notes'}
                            </p>
                        </div>
                    </div>
                `;
                
                const modal = new bootstrap.Modal(document.getElementById('viewPatientModal'));
                modal.show();
            }
        }

        // Edit patient
        function editPatient(id) {
            const patient = patients.find(p => p.id === id);
            if (patient) {
                // Populate form
                document.getElementById('patientId').value = patient.id;
                document.getElementById('patientName').value = patient.name;
                document.getElementById('ownerName').value = patient.owner;
                document.getElementById('species').value = patient.species;
                updateBreedOptions();
                document.getElementById('breed').value = patient.breed;
                document.getElementById('birthDate').value = patient.birthDate;
                document.getElementById('ownerPhone').value = patient.ownerPhone;
                document.getElementById('ownerEmail').value = patient.ownerEmail || '';
                document.getElementById('notes').value = patient.notes || '';
                
                // Update modal title
                document.getElementById('modalTitle').textContent = 'Edit Patient';
                document.getElementById('saveButtonText').textContent = 'Update Patient';
                
                // Show modal
                const modal = new bootstrap.Modal(document.getElementById('patientModal'));
                modal.show();
            }
        }

        // Delete patient
        function deletePatient(id) {
            if (confirm('Are you sure you want to delete this patient? This action cannot be undone.')) {
                patients = patients.filter(p => p.id !== id);
                filteredPatients = filteredPatients.filter(p => p.id !== id);
                
                // Save to localStorage
                localStorage.setItem('patients', JSON.stringify(patients));
                
                renderPatientsTable();
                updateStats();
                showToast('Patient deleted successfully', 'success');
            }
        }

        // Export to CSV
        function exportToCSV() {
            let csv = 'ID,Name,Species,Breed,Owner,Phone,Email,Birth Date,Age,Added Date,Notes\n';
            
            patients.forEach(patient => {
                const age = calculateAge(patient.birthDate);
                csv += `${patient.id},"${patient.name}","${patient.species}","${patient.breed}","${patient.owner}","${patient.ownerPhone}","${patient.ownerEmail || ''}","${patient.birthDate}",${age},"${patient.date}","${patient.notes || ''}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `patients_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            showToast('Patients exported successfully', 'success');
        }

        // Book appointment
        function bookAppointment() {
            showToast('Redirecting to appointment booking...', 'success');
            setTimeout(() => {
                window.location.href = 'appointments.html';
            }, 1500);
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-body">
                    <i class="bi bi-${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'exclamation-circle'}"></i>
                    ${message}
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Show toast
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Close filter menu when clicking outside
        document.addEventListener('click', function(e) {
            const filterDropdown = document.querySelector('.filter-dropdown');
            const filterMenu = document.getElementById('filterMenu');
            
            if (!filterDropdown.contains(e.target)) {
                filterMenu.classList.remove('show');
            }
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('.mobile-menu-toggle');
            
            if (window.innerWidth <= 768 && 
                !sidebar.contains(e.target) && 
                !toggle.contains(e.target) &&
                sidebar.classList.contains('mobile-show')) {
                sidebar.classList.remove('mobile-show');
            }
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + K for search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            
            // Escape to close modals
            if (e.key === 'Escape') {
                const modals = document.querySelectorAll('.modal.show');
                modals.forEach(modal => {
                    bootstrap.Modal.getInstance(modal).hide();
                });
            }
        });

        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
