<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EVetCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2E7D32 0%, #66BB6A 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --primary-light: rgba(46, 125, 50, 0.2);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #66BB6A 0%, #2E7D32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #66BB6A 0%, #2E7D32 100%);
            z-index: -1;
        }

        /* Floating Background Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.7;
            animation: float 20s infinite ease-in-out;
            z-index: -1;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: rgba(102, 187, 106, 0.4);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 250px;
            height: 250px;
            background: rgba(46, 125, 50, 0.4);
            bottom: -125px;
            right: -125px;
            animation-delay: 5s;
        }

        .orb3 {
            width: 200px;
            height: 200px;
            background: rgba(129, 199, 132, 0.4);
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        .orb4 {
            width: 180px;
            height: 180px;
            background: rgba(200, 230, 201, 0.4);
            top: 20%;
            right: 10%;
            animation-delay: 15s;
        }

        .orb5 {
            width: 220px;
            height: 220px;
            background: rgba(102, 187, 106, 0.3);
            bottom: 20%;
            left: 5%;
            animation-delay: 7s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            75% {
                transform: translate(40px, 10px) scale(1.05);
            }
        }

        /* Particle System */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(46, 125, 50, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 15s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Loading Animation */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2E7D32 0%, #66BB6A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        .loader-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-top-color: rgba(255, 255, 255, 0.7);
            animation-duration: 1.2s;
            animation-direction: reverse;
        }

        .loader-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-top-color: rgba(255, 255, 255, 0.4);
            animation-duration: 0.9s;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Register Container */
        .register-container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
            padding: 32px 40px; /* Reduced from 48px 40px */
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.5), 
                transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        /* Brand Section */
        .brand-section {
            text-align: center;
            margin-bottom: 28px; /* Reduced from 40px */
            position: relative;
        }

        .brand-logo {
            width: 80px; /* Reduced from 90px */
            height: 80px; /* Reduced from 90px */
            background: var(--primary-gradient);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px; /* Reduced from 20px */
            box-shadow: 0 15px 30px rgba(46, 125, 50, 0.4);
            animation: pulse 2s infinite, float 6s ease-in-out infinite;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .brand-logo::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .brand-logo:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 20px 40px rgba(46, 125, 50, 0.5);
        }

        .brand-logo i {
            font-size: 40px; /* Reduced from 45px */
            color: white;
            z-index: 1;
            position: relative;
        }

        .brand-name {
            font-size: 30px; /* Reduced from 32px */
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px; /* Reduced from 8px */
            letter-spacing: -1px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .brand-tagline {
            color: var(--text-secondary);
            font-size: 15px; /* Reduced from 16px */
            font-weight: 500;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form Styling */
        .form-floating {
            margin-bottom: 18px; /* Reduced from 24px */
            position: relative;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .form-floating:nth-child(2) { animation-delay: 0.5s; }
        .form-floating:nth-child(3) { animation-delay: 0.6s; }
        .form-floating:nth-child(4) { animation-delay: 0.7s; }
        .form-floating:nth-child(5) { animation-delay: 0.8s; }
        .form-floating:nth-child(6) { animation-delay: 0.9s; }

        .form-control {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(46, 125, 50, 0.1);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            padding: 14px 20px; /* Reduced from 18px 20px */
            height: auto;
            transition: var(--transition);
            position: relative;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #2E7D32;
            color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
            outline: none;
            transform: translateY(-2px);
        }

        .form-control:hover {
            border-color: rgba(46, 125, 50, 0.3);
            transform: translateY(-1px);
        }

        .form-floating label {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 14px 20px; /* Reduced from 18px 20px */
            transition: var(--transition);
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #2E7D32;
            background: transparent;
            font-weight: 600;
        }

        /* Password Strength Indicator */
        .password-strength {
            height: 6px;
            border-radius: 3px;
            margin-top: 8px; /* Reduced from 12px */
            background: rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .password-strength-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            animation: shimmer 2s infinite;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        .password-strength-bar.medium {
            width: 66%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .password-strength-bar.strong {
            width: 100%;
            background: linear-gradient(90deg, #2E7D32, #66BB6A);
        }

        /* Terms Checkbox */
        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 24px; /* Reduced from 32px */
            animation: fadeInUp 0.8s ease-out 1s both;
        }

        .form-check-input {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(46, 125, 50, 0.3);
            border-radius: 8px;
            margin-top: 2px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .form-check-input:checked {
            background: var(--primary-gradient);
            border-color: #2E7D32;
            animation: checkPop 0.3s ease;
        }

        @keyframes checkPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .form-check-input:checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            animation: checkmark 0.3s ease;
        }

        @keyframes checkmark {
            0% { 
                height: 0;
                transform: rotate(45deg) translateY(0);
            }
            100% { 
                height: 12px;
                transform: rotate(45deg) translateY(0);
            }
        }

        .form-check-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            cursor: pointer;
            transition: var(--transition);
        }

        .form-check-label a {
            color: #1976D2;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
        }

        .form-check-label a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #1976D2;
            transition: width 0.3s ease;
        }

        .form-check-label a:hover::after {
            width: 100%;
        }

        /* Premium Button */
        .btn-premium {
            width: 100%;
            padding: 14px; /* Reduced from 18px */
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out 1.1s both;
        }

        .btn-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            transition: left 0.6s ease;
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(46, 125, 50, 0.5);
        }

        .btn-premium:hover::before {
            left: 100%;
        }

        .btn-premium:active {
            transform: translateY(-1px);
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0; /* Reduced from 36px */
            animation: fadeInUp 0.8s ease-out 1.2s both;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 125, 50, 0.3), transparent);
        }

        .divider span {
            padding: 0 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Login Buttons */
        .social-login {
            display: flex;
            gap: 16px;
            animation: fadeInUp 0.8s ease-out 1.3s both;
        }

        .btn-social {
            flex: 1;
            padding: 12px; /* Reduced from 16px */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(46, 125, 50, 0.1);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn-social::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(46, 125, 50, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .btn-social:hover::before {
            width: 100px;
            height: 100px;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-color: rgba(46, 125, 50, 0.3);
        }

        .btn-social i {
            position: relative;
            z-index: 1;
            transition: var(--transition);
        }

        .btn-social:hover i {
            transform: scale(1.1);
        }

        /* Login Link */
        .login-link {
            text-align: center;
            margin-top: 28px; /* Reduced from 36px */
            color: var(--text-secondary);
            font-size: 15px;
            animation: fadeInUp 0.8s ease-out 1.4s both;
        }

        .login-link a {
            color: #2E7D32;
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
            position: relative;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        /* Alert Styling */
        .alert-custom {
            background: rgba(46, 125, 50, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46, 125, 50, 0.2);
            border-radius: 12px;
            color: #2E7D32;
            padding: 12px 20px; /* Reduced from 16px 20px */
            margin-bottom: 18px; /* Reduced from 24px */
            animation: slideDown 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .alert-custom::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary-gradient);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success Animation */
        @keyframes successPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .success-animation {
            animation: successPulse 0.6s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #1B5E20, #4CAF50);
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            .glass-card {
                padding: 24px 20px; /* Reduced from 32px 24px */
                border-radius: 20px;
            }

            .brand-name {
                font-size: 26px; /* Reduced from 28px */
            }

            .brand-tagline {
                font-size: 13px; /* Reduced from 14px */
            }

            .social-login {
                flex-direction: column;
            }

            .terms-checkbox {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .form-control {
                padding: 12px 16px; /* Reduced from 16px 18px */
                font-size: 15px;
            }

            .btn-premium {
                padding: 12px; /* Reduced from 16px */
                font-size: 15px;
            }
        }

        /* Touch-Friendly Mobile Design */
        @media (hover: none) and (pointer: coarse) {
            .btn-premium,
            .btn-social,
            .form-check-input,
            .form-check-label a {
                min-height: 44px;
                min-width: 44px;
            }

            .form-control {
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High Contrast Mode Support */
        @media (prefers-contrast: high) {
            .glass-card {
                background: rgba(255, 255, 255, 0.95);
                border: 2px solid #000;
            }

            .form-control {
                border: 2px solid #000;
            }
        }

        /* Print Styles */
        @media print {
            .bg-orb,
            .particles,
            .loader-container {
                display: none !important;
            }

            .glass-card {
                background: white !important;
                box-shadow: none !important;
                border: 1px solid #000 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Animation -->
    <div class="loader-container" id="loader">
        <div class="loader">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- Animated Background -->
    <div class="hero"></div>

    <!-- Floating Background Orbs -->
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="bg-orb orb4"></div>
    <div class="bg-orb orb5"></div>

    <!-- Particle System -->
    <div class="particles" id="particles"></div>

    <!-- Register Container -->
    <div class="register-container">
        <div class="glass-card">
            <!-- Brand Section -->
            <div class="brand-section">
                <div class="brand-logo">
                    <i class="bi bi-heart-pulse-fill"></i>
                </div>
                <h1 class="brand-name">Create Account</h1>
                <p class="brand-tagline">Join EVetCare today</p>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <!-- Register Form -->
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                            <label for="firstName">First Name</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                            <label for="lastName">Last Name</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>

                <div class="form-floating">
                    <input type="text" class="form-control" id="username" placeholder="Username" required>
                    <label for="username">Username</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required oninput="checkPasswordStrength()">
                    <label for="password">Password</label>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                    <label for="confirmPassword">Confirm Password</label>
                </div>

                <div class="terms-checkbox">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-premium ripple">
                    Create Account
                </button>
            </form>

            <div class="divider">
                <span>or register with</span>
            </div>

            <div class="social-login">
                <button class="btn-social ripple" onclick="socialRegister('google')">
                    <i class="bi bi-google"></i>
                </button>
                <button class="btn-social ripple" onclick="socialRegister('microsoft')">
                    <i class="bi bi-microsoft"></i>
                </button>
                <button class="btn-social ripple" onclick="socialRegister('apple')">
                    <i class="bi bi-apple"></i>
                </button>
            </div>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles
        createParticles();

        // Hide loader when page loads
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 1000);
        });

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (strength <= 1) {
                strengthBar.classList.add('weak');
            } else if (strength === 2) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        }

        // Social register handler
        function socialRegister(provider) {
            const alertContainer = document.getElementById('alertContainer');
            const providerIcons = {
                'google': 'bi-google',
                'microsoft': 'bi-microsoft',
                'apple': 'bi-apple'
            };
            
            alertContainer.innerHTML = `
                <div class="alert-custom">
                    <i class="bi ${providerIcons[provider]} me-2"></i>
                    Redirecting to ${provider} registration...
                </div>
            `;
            
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 3000);
        }

        // Ripple effect for buttons
        document.querySelectorAll('.ripple').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Form submission with enhanced feedback
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertContainer = document.getElementById('alertContainer');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert(alertContainer, 'Passwords do not match!', 'warning');
                shakeForm();
                return;
            }
            
            // Validate password strength
            const strengthBar = document.getElementById('passwordStrengthBar');
            if (!strengthBar.classList.contains('medium') && !strengthBar.classList.contains('strong')) {
                showAlert(alertContainer, 'Please choose a stronger password!', 'warning');
                shakeForm();
                return;
            }
            
            // Create registration data object
            const registrationData = {
                firstName: firstName,
                lastName: lastName,
                username: username,
                email: email,
                password: password
            };
            
            // Show loading state
            const submitBtn = this.querySelector('.btn-premium');
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = '<i class="bi bi-arrow-repeat me-2"></i>Creating...';
            submitBtn.disabled = true;
            
            // Send registration request
            fetch('/api/vetusers/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(registrationData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                return response.json();
            })
            .then(data => {
                // Success animation
                document.querySelector('.glass-card').classList.add('success-animation');
                showAlert(alertContainer, 'Account created successfully! Redirecting to login...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            })
            .catch(error => {
                showAlert(alertContainer, error.message || 'Registration failed. Please try again.', 'danger');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                shakeForm();
            });
        });
        
        // Helper function to show alerts
        function showAlert(container, message, type) {
            const iconClass = type === 'success' ? 'check-circle-fill' : 
                             type === 'warning' ? 'exclamation-triangle-fill' : 
                             'x-circle-fill';
            
            container.innerHTML = `
                <div class="alert-custom alert-${type}">
                    <i class="bi bi-${iconClass} me-2"></i>
                    ${message}
                </div>
            `;
        }
        
        // Shake animation for form errors
        function shakeForm() {
            const form = document.querySelector('.glass-card');
            form.style.animation = 'shake 0.5s';
            setTimeout(() => {
                form.style.animation = '';
            }, 500);
        }
        
        // Add shake keyframe
        const shakeKeyframe = document.createElement('style');
        shakeKeyframe.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(shakeKeyframe);

        // Mouse-following orb effect
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.bg-orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 20;
                const xOffset = (x - 0.5) * speed;
                const yOffset = (y - 0.5) * speed;
                
                orb.style.transform = `translate(${xOffset}px, ${yOffset}px) scale(${1 + (index * 0.02)})`;
            });
        });

        // Add input focus effects
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Performance optimization - throttle scroll events
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                document.body.classList.add('keyboard-nav');
            }
        });

        document.addEventListener('mousedown', () => {
            document.body.classList.remove('keyboard-nav');
        });

        // Add CSS for keyboard navigation
        const keyboardStyle = document.createElement('style');
        keyboardStyle.textContent = `
            .keyboard-nav *:focus {
                outline: 3px solid var(--primary-light) !important;
                outline-offset: 2px !important;
            }
        `;
        document.head.appendChild(keyboardStyle);
    </script>
</body>
</html>
