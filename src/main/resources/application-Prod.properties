# ===============================
# APPLICATION INFO
# ===============================
info.app.name=EVetCare
info.app.version=@project.version@
info.app.description=Veterinary Practice Management System

# ===============================
# SERVER
# ===============================
# For local dev use 8080, Render will override with PORT env variable
server.port=${PORT:8080}

# ===============================
# DATABASE (MySQL - Aiven)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evetcare?ssl-mode=REQUIRED&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Hibernate performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# KAFKA
# ===============================
#spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.consumer.group-id=vet-software-group
#spring.kafka.consumer.auto-offset-reset=earliest
#spring.kafka.bootstrap-servers=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# Metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99

# ===============================
# OTP CONFIGURATION
# ===============================
app.otp.expirationMs=600000
app.otp.maxAttempts=3
app.otp.length=6
app.otp.rateLimitMinutes=1

# ===============================
# FRONTEND
# ===============================
app.frontend.url=http://localhost:8080

# ===============================
# EMAIL DEBUG
# ===============================
spring.mail.debug=true

# ===============================
# LOGGING
# ===============================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.idexx.vetsoftware=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=TRACE
